name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Without this a busy afternoon
# queues runs behind results nobody is waiting for any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two versions, cheaply. Catches accidental reliance on one release's
        # behaviour long before a deployment does. 3.12 is the floor because
        # NumPy's type stubs need it - see the note in pyproject.toml.
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy

      - name: Test
        # The coverage gate is a floor, not a target. It exists to stop a whole
        # module arriving untested, not to encourage tests written for the metric.
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm run test
      - name: Build
        run: npx vite build

  contract:
    name: API contract has not drifted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --frozen
        working-directory: backend

      - name: Dump the OpenAPI document
        working-directory: backend
        run: |
          uv run python -c "import json, pathlib; from api.main import app; \
            pathlib.Path('openapi.json').write_text(json.dumps(app.openapi(), indent=2))"

      - run: npm ci
        working-directory: frontend

      - name: Regenerate the client types
        working-directory: frontend
        run: npm run generate:types

      # The committed types must match what the live schema produces. If a route or
      # a field changed and the types were not regenerated, this fails here rather
      # than as a runtime error in a browser.
      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- frontend/src/types/api.d.ts; then
            echo "::error::The API contract changed but frontend/src/types/api.d.ts was not regenerated. Regenerate it with 'npm run generate:types' in frontend/ and commit the result."
            exit 1
          fi

  image:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: options-pricing-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

      # Building is not the same as working. This starts the image and waits for the
      # readiness probe, so a container that builds but cannot boot fails here.
      - name: Smoke test the running container
        run: |
          docker run -d --name api -p 8000:8000 options-pricing-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Container never became healthy"
              docker logs api
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/ready | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS -X POST http://localhost:8000/api/v1/price \
            -H 'Content-Type: application/json' \
            -d '{"option":{"spot":100,"strike":100,"time_to_expiry":1,"risk_free_rate":0.05,"volatility":0.2},"model":"black_scholes"}' \
            | grep -q '"price":10.45'
          docker rm -f api

      # Pinned to a real release tag. Note the `v` prefix: this action migrated to
      # `v`-prefixed tags after a supply-chain incident, and the unprefixed tags are
      # not maintained. Dependabot keeps this current (see .github/dependabot.yml);
      # pinning to a commit SHA instead would be stricter again.
      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: options-pricing-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
