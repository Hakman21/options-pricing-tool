# Automated dependency updates.
#
# Everything is grouped so each ecosystem produces at most one or two pull requests
# rather than one per package. Ungrouped, a fresh repository opens a dozen PRs the
# first time this runs, and a bot that floods the queue gets muted - at which point
# it protects nothing.
#
# Version updates run on this schedule. Security advisories are separate: GitHub
# raises those immediately regardless of what is configured here, so a relaxed
# cadence costs nothing in safety.

version: 2
updates:
  # The Docker base image. If the FROM line is pinned to a digest
  # (scripts/pin_base_image.py), this is what keeps that pin current.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: build

  # Python. One PR for the lot: they are checked together by CI anyway, and a
  # single "did the suite stay green" decision is easier than eight of them.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
    groups:
      javascript:
        patterns: ["*"]

  # Workflow actions. Monthly, because they move slowly - and because an action
  # pinned to a stale tag is how a deprecated runner silently breaks a build.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
